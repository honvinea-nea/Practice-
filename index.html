<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Sign In</title>
     <link rel="preconnect" href="https://fonts.googleapis.com" />
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet" />
     <link rel="stylesheet" href="style.css" />
</head>

<body>
     <div class="page-shell">
          <div class="signin-card">
               <div class="brand-panel">
                    <div class="brand-badge">A</div>
                    <div class="welcome-copy">
                         <p class="eyebrow">Welcome back</p>
                         <h1>Access your workspace</h1>
                    </div>

                    <div class="feature-list">
                         <div class="feature-item">
                              <span class="feature-icon">✓</span>
                              <span>Secure daily access</span>
                         </div>
                         <div class="feature-item">
                              <span class="feature-icon">✓</span>
                              <span>Fast team collaboration</span>
                         </div>
                         <div class="feature-item">
                              <span class="feature-icon">✓</span>
                              <span>Smart productivity tools</span>
                         </div>
                    </div>

                    <div class="mini-stats">
                         <div>
                              <strong>12k+</strong>
                              <span>users</span>
                         </div>
                         <div>
                              <strong>99.9%</strong>
                              <span>uptime</span>
                         </div>
                    </div>
               </div>

               <div class="form-panel">
                    <div class="form-header">
                         <p class="eyebrow dark">Sign in</p>
                         <h2>Welcome back</h2>
                    </div>

                    <form class="signin-form">
                         <label class="input-group">
                              <span>Email address</span>
                              <input type="email" placeholder="you@example.com" />
                         </label>

                         <label class="input-group">
                              <span>Password</span>
                              <input type="password" placeholder="Enter your password" />
                         </label>

                         <div class="row between">
                              <label class="checkbox-wrap">
                                   <input type="checkbox" checked />
                                   <span>Remember me</span>
                              </label>
                              <a href="#">Forgot password?</a>
                         </div>

                         <button type="submit" class="primary-btn">Sign in</button>
                    </form>

                    <div class="divider"><span>or continue with</span></div>

                    <div class="social-row">
                         <button type="button" class="social-btn">Google</button>
                         <button type="button" class="social-btn">GitHub</button>
                    </div>

                    <p class="signup-text">
                         Don’t have an account? <a href="#">Create one</a>
                    </p>
               </div>
          </div>
     </div>
</body>

</html>
