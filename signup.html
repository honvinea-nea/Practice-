<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Sign Up</title>
     <link rel="preconnect" href="https://fonts.googleapis.com" />
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet" />
     <link rel="stylesheet" href="signup.css" />
</head>

<body>
     <div class="page-shell">
          <div class="signup-card">
               <div class="brand-panel">
                    <div class="brand-badge">A</div>
                    <div class="welcome-copy">
                         <p class="eyebrow">Create account</p>
                         <h1>Start building with us</h1>
                    </div>

                    <div class="feature-list">
                         <div class="feature-item">
                              <span class="feature-icon">✓</span>
                              <span>Organize your workflow</span>
                         </div>
                         <div class="feature-item">
                              <span class="feature-icon">✓</span>
                              <span>Collaborate in real time</span>
                         </div>
                         <div class="feature-item">
                              <span class="feature-icon">✓</span>
                              <span>Scale with smarter tools</span>
                         </div>
                    </div>

                    <div class="mini-stats">
                         <div>
                              <strong>4.8/5</strong>
                              <span>rating</span>
                         </div>
                         <div>
                              <strong>24/7</strong>
                              <span>support</span>
                         </div>
                    </div>
               </div>

               <div class="form-panel">
                    <div class="form-header">
                         <p class="eyebrow dark">Sign up</p>
                         <h2>Create account</h2>
                    </div>

                    <form class="signup-form">
                         <div class="name-row">
                              <label class="input-group">
                                   <span>First name</span>
                                   <input type="text" placeholder="John" />
                              </label>

                              <label class="input-group">
                                   <span>Last name</span>
                                   <input type="text" placeholder="Doe" />
                              </label>
                         </div>

                         <label class="input-group">
                              <span>Email address</span>
                              <input type="email" placeholder="you@example.com" />
                         </label>

                         <label class="input-group">
                              <span>Password</span>
                              <input type="password" placeholder="Create a password" />
                         </label>

                         <label class="input-group">
                              <span>Confirm password</span>
                              <input type="password" placeholder="Re-enter your password" />
                         </label>

                         <label class="checkbox-wrap">
                              <input type="checkbox" checked />
                              <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
                         </label>

                         <button type="submit" class="primary-btn">Create account</button>
                    </form>

                    <div class="divider"><span>or sign up with</span></div>

                    <div class="social-row">
                         <button type="button" class="social-btn">Google</button>
                         <button type="button" class="social-btn">GitHub</button>
                    </div>

                    <p class="signin-text">
                         Already have an account? <a href="index.html">Sign in</a>
                    </p>
               </div>
          </div>
     </div>
</body>

</html>
